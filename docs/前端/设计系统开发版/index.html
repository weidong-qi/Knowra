<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>知境 Knowra · 本地开发版</title>
    <link
      rel="icon"
      href="/project/assets/Logos/knowra-favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="/generated/tokens.css" />
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#overview">知境 <span>Knowra</span></a>
      <span class="local-label">本地开发版</span>
      <label class="theme-label"
        >预览主题
        <select id="theme" aria-label="预览主题"></select
      ></label>
      <a
        class="source-link"
        href="/project/tokens.json"
        target="_blank"
        rel="noreferrer"
        >查看变量</a
      >
    </header>
    <div class="shell">
      <aside class="sidebar">
        <input
          id="search"
          type="search"
          aria-label="搜索设计变量与组件"
          placeholder="搜索变量与组件"
        />
        <nav id="nav" aria-label="设计系统章节"></nav>
        <p class="sidebar-note">修改本地源文件<br />页面会自动刷新</p>
      </aside>
      <main id="main" tabindex="-1">
        <p class="loading">正在载入设计系统…</p>
      </main>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
