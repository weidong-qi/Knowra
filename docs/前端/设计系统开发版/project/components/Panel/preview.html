<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Knowra, I = K.Icons, h = React.createElement, useState = React.useState;

function Demo() {
  return h('div', { style: { padding: 16, maxWidth: 360 } },
    h(K.Panel, {
      title: h(React.Fragment, null, h(I.KnowledgeIcon, { size: 14 }), '关联知识点'),
      headerActions: h('span', null, '3 个'),
      footer: h(React.Fragment, null, h('span', { style: { fontSize: 12, color: 'var(--text-muted)' } }, '2 分钟前更新'), h(K.Button, { size: 'compact', emphasis: 'soft' }, '查看全部')),
    }, h('span', null, '特征值与特征向量'), h('span', null, '矩阵的相似对角化'), h('span', null, '二次型')));
}
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
