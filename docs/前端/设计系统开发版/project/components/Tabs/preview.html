<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tabs</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Knowra, I = K.Icons, h = React.createElement, useState = React.useState;

function Demo() {
  const items = [{ id: 'notes', label: '笔记', badge: 12 }, { id: 'points', label: '知识点' }, { id: 'quiz', label: '试题', badge: 3 }, { id: 'trash', label: '回收站', isDisabled: true }];
  const text = { notes: '当前文件夹下的 12 篇笔记。', points: '从笔记里提炼出的 46 个知识点。', quiz: '3 份待完成的考卷。' };
  return h('div', { style: { padding: '12px 16px' } }, h(K.Tabs, { items }, (item) => text[item.id] || ''));
}
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
