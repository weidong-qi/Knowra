<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知境 · 知识库阅读工作台</title>
    <style>
      /* 独立展示原型。视觉依据：tokens.css、NotesIndexTheme、NotesIndexView、
         NoteEditorView、PdfReader 与共享 Button；不依赖生产应用，不请求后端。 */
      :root {
        color-scheme: light;
        --chrome: #f1f2f5;
        --paper: #fbfcfd;
        --sidebar: #fafafb;
        --raised: #fff;
        --ink: #17181b;
        --body: #353a43;
        --muted: #6c727c;
        --line: rgba(24, 30, 48, 0.1);
        --hover: rgba(24, 30, 48, 0.045);
        --selected: #eceef2;
        --accent: #17181b;
        --on: #fff;
        --green: #30745a;
        --green-bg: #edf5f0;
        --amber: #91631e;
        --amber-bg: #faf2df;
        --shadow:
          0 0 0 1px rgba(24, 30, 48, 0.07), 0 1px 2px rgba(24, 30, 48, 0.05), 0 6px 18px -6px rgba(24, 30, 48, 0.1),
          0 22px 48px -18px rgba(24, 30, 48, 0.14);
        font:
          13px/1.6 Inter,
          'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --chrome: #191b1f;
        --paper: #23252a;
        --sidebar: #202227;
        --raised: #2c2f35;
        --ink: #ececee;
        --body: #d0d3da;
        --muted: #a4aab4;
        --line: rgba(220, 225, 235, 0.12);
        --hover: rgba(220, 225, 235, 0.05);
        --selected: #353940;
        --accent: #ececee;
        --on: #202227;
        --green: #a3d1b7;
        --green-bg: #293d33;
        --amber: #e4c789;
        --amber-bg: #40382a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--chrome);
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button,
      input,
      select,
      textarea {
        outline-offset: 3px;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--muted);
      }
      button {
        border: 0;
        background: none;
      }
      a {
        color: inherit;
      }
      svg.icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.25;
        font-weight: 620;
        letter-spacing: -1px;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        font-weight: 580;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .hidden {
        display: none !important;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .app {
        height: 100dvh;
        display: grid;
        grid-template-columns: 50px minmax(0, 1fr);
        grid-template-rows: 42px minmax(0, 1fr);
        padding: 0 8px 8px 0;
      }
      .titlebar {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        padding: 0 15px;
        gap: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .brand {
        font-size: 13px;
        font-weight: 650;
        color: var(--ink);
        letter-spacing: 0.8px;
      }
      .title-tab {
        height: 29px;
        background: var(--raised);
        border-radius: 6px;
        box-shadow: 0 1px 2px #0001;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 15px;
        color: var(--ink);
      }
      .title-tab svg {
        width: 14px;
        height: 14px;
      }
      .demo {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 1px 9px;
        font-size: 10px;
      }
      .rail {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
        padding: 13px 0;
      }
      .rail-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--ink);
        color: var(--paper);
        display: grid;
        place-items: center;
        font:
          600 17px Georgia,
          serif;
        margin-bottom: 10px;
      }
      .rail .icon-btn {
        width: 34px;
        height: 34px;
        color: var(--muted);
      }
      .rail .active {
        background: var(--raised);
        box-shadow: 0 1px 3px #0002;
        color: var(--ink);
      }
      .rail-spacer {
        flex: 1;
      }
      .workspace {
        display: flex;
        min-width: 0;
        overflow: hidden;
        border-radius: 12px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      .sidebar {
        width: 212px;
        flex: none;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side-title {
        height: 45px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      .side-scroll {
        padding: 16px 10px;
        overflow: auto;
        flex: 1;
      }
      .nav-label {
        font-size: 11px;
        color: var(--muted);
        padding: 15px 10px 7px;
      }
      .nav-label:first-child {
        padding-top: 0;
      }
      .nav {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 35px;
        padding: 7px 10px;
        border-radius: 6px;
        text-align: left;
        color: var(--body);
        font-size: 12px;
      }
      .nav .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .nav span.count {
        margin-left: auto;
        color: var(--muted);
        font:
          11px ui-monospace,
          monospace;
      }
      .nav:hover {
        background: var(--hover);
      }
      .nav.active {
        background: var(--raised);
        box-shadow: 0 1px 3px #0001;
        color: var(--ink);
        font-weight: 550;
      }
      .side-bottom {
        padding: 13px 20px;
        border-top: 1px solid var(--line);
        font-size: 10px;
        color: var(--muted);
      }
      .side-note {
        padding: 14px 10px 0;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.9;
      }
      .star {
        color: #a98333;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        height: 45px;
        flex: none;
        border-bottom: 1px solid var(--line);
        padding: 0 17px;
        gap: 9px;
        display: flex;
        align-items: center;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .crumb b {
        font-weight: 500;
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        min-height: 29px;
        border-radius: 99px;
        padding: 4px 12px;
        border: 1px solid var(--line);
        background: var(--raised);
        font-size: 12px;
        box-shadow: 0 1px 2px #00000008;
      }
      .btn .icon {
        width: 14px;
        height: 14px;
      }
      .btn:hover {
        background: var(--selected);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        color: var(--muted);
      }
      .btn.ghost:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .icon-btn:hover {
        background: var(--hover);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 3px 10px;
        background: var(--raised);
        width: 205px;
        color: var(--muted);
      }
      .search .icon {
        width: 14px;
        height: 14px;
      }
      .search input {
        border: 0;
        background: transparent;
        width: 100%;
        min-width: 0;
        color: var(--ink);
        font-size: 11px;
        outline: none;
      }
      .search:focus-within {
        box-shadow: 0 0 0 3px var(--selected);
      }
      kbd {
        font:
          10px ui-monospace,
          monospace;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        color: var(--muted);
      }
      .stage {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .scroll {
        overflow: auto;
        flex: 1;
        min-width: 0;
        scroll-behavior: smooth;
      }
      .reading {
        max-width: 920px;
        margin: 0 auto;
        padding: 43px clamp(24px, 5vw, 70px) 60px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.7px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .intro {
        margin: 12px 0 21px;
        color: var(--muted);
        font-size: 13px;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        gap: 13px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hero {
        padding-bottom: 26px;
        border-bottom: 1px solid var(--line);
      }
      .hero-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 27px;
      }
      .tab {
        padding: 13px 0 11px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: var(--ink);
        border-color: var(--ink);
      }
      .tab small {
        margin-left: 5px;
        color: var(--muted);
      }
      .section {
        margin-top: 28px;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }
      .section-head h2 {
        font-size: 14px;
      }
      .section-number {
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
      }
      .section-head .right {
        margin-left: auto;
      }
      .definition {
        padding: 21px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
      }
      .definition p {
        font-size: 14px;
        line-height: 1.95;
        color: var(--body);
      }
      .definition .meta {
        margin-top: 15px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
      }
      .badge {
        font-size: 10px;
        line-height: 1.4;
        border-radius: 4px;
        padding: 3px 6px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--selected);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.ok {
        color: var(--green);
        background: var(--green-bg);
      }
      .badge.warn {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .link {
        font-size: 11px;
        color: var(--muted);
        padding: 0;
        text-align: left;
      }
      .link:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .knowledge-row {
        display: flex;
        gap: 14px;
        padding: 17px 3px;
        width: 100%;
        border-bottom: 1px solid var(--line);
        text-align: left;
        align-items: flex-start;
      }
      .knowledge-row:hover {
        background: var(--hover);
      }
      .row-icon {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border-radius: 7px;
        background: var(--selected);
        color: var(--muted);
        font:
          14px Georgia,
          serif;
        flex: none;
      }
      .row-title {
        font-size: 13px;
        font-weight: 550;
        margin-bottom: 5px;
      }
      .row-copy {
        font-size: 12px;
        line-height: 1.8;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row-arrow {
        margin-left: auto;
        color: var(--muted);
        padding-top: 7px;
      }
      .row-arrow .icon {
        width: 14px;
        height: 14px;
      }
      .formula {
        font:
          italic 19px/1.8 Georgia,
          'Times New Roman',
          serif;
        text-align: center;
        padding: 18px 12px;
        background: var(--hover);
        border-radius: 6px;
        margin: 15px 0;
        color: var(--ink);
      }
      .mention {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 0 14px;
      }
      .mention .knowledge-row:last-child {
        border: 0;
      }
      .foot {
        height: 28px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        font-size: 10px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        background: var(--hover);
      }
      .dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--green);
        border-radius: 50%;
        margin-right: 5px;
      }
      .inspector {
        width: 348px;
        flex: none;
        margin: 8px 8px 8px 0;
        background: var(--sidebar);
        border: 1px solid var(--line);
        box-shadow: 0 6px 20px -12px #0003;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .inspector-head {
        height: 43px;
        display: flex;
        align-items: center;
        padding: 0 15px;
        border-bottom: 1px solid var(--line);
        gap: 8px;
        font-size: 12px;
      }
      .inspector-body {
        overflow: auto;
        padding: 23px 20px;
        flex: 1;
      }
      .inspector h2 {
        font-size: 19px;
        line-height: 1.5;
        margin: 10px 0 16px;
      }
      .inspector p {
        font-size: 12px;
        line-height: 1.95;
        color: var(--body);
      }
      .inspector h3 {
        font-size: 11px;
        margin: 25px 0 9px;
        color: var(--muted);
      }
      .inspector-actions {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
      }
      .quote {
        padding: 15px;
        border: 1px solid var(--line);
        background: var(--raised);
        border-radius: 7px;
        font-size: 12px;
        line-height: 1.9;
        color: var(--body);
      }
      .quote mark {
        color: inherit;
        background: var(--amber-bg);
      }
      .context-link {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        align-items: center;
        color: var(--muted);
        font-size: 11px;
      }
      .inspector .pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .inspector .pills .btn {
        font-size: 11px;
      }
      .inspector-note {
        background: var(--amber-bg);
        color: var(--amber);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 11px;
        margin-top: 15px;
      }
      .catalog {
        max-width: 1100px;
        margin: auto;
        padding: 35px 38px 50px;
      }
      .catalog h1 {
        font-size: 27px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 25px 0 15px;
        flex-wrap: wrap;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid var(--line);
        background: var(--hover);
        padding: 3px;
        border-radius: 99px;
        gap: 2px;
      }
      .segmented button {
        padding: 3px 12px;
        border-radius: 99px;
        font-size: 11px;
        color: var(--muted);
      }
      .segmented button.active {
        background: var(--raised);
        color: var(--ink);
        box-shadow: 0 1px 3px #0001;
      }
      .concept-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }
      .concept-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--raised);
        text-align: left;
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      .concept-card:hover {
        box-shadow: 0 7px 20px -12px #0005;
        transform: translateY(-2px);
      }
      .concept-card .row-icon {
        margin-bottom: 18px;
      }
      .concept-card h2 {
        font-size: 17px;
        margin-bottom: 7px;
      }
      .concept-card p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
        min-height: 44px;
      }
      .concept-card .meta {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 17px;
        font-size: 10px;
      }
      .list-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 4px;
        color: var(--muted);
        font-size: 11px;
        border-bottom: 1px solid var(--line);
      }
      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
      }
      .empty h2 {
        color: var(--ink);
        margin-bottom: 8px;
      }
      .review-note {
        padding: 13px 16px;
        border-radius: 8px;
        background: var(--hover);
        font-size: 12px;
        color: var(--muted);
        margin: 18px 0;
      }
      .relation {
        display: flex;
        align-items: center;
        padding: 14px 0;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .relation .grow {
        font-weight: 550;
      }
      .relation-label {
        font-size: 11px;
        color: var(--muted);
        width: 67px;
      }
      .graph {
        width: 100%;
        height: auto;
        min-height: 280px;
        background: radial-gradient(var(--line) 1px, transparent 1px);
        background-size: 18px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 16px 0;
      }
      .graph text {
        fill: var(--ink);
        font:
          12px system-ui,
          sans-serif;
      }
      .graph line {
        stroke: var(--muted);
        stroke-width: 1;
      }
      .graph rect {
        fill: var(--raised);
        stroke: var(--line);
      }
      .graph .center rect {
        fill: var(--accent);
      }
      .graph .center text {
        fill: var(--on);
      }
      .graph .edge-label {
        font-size: 10px;
        fill: var(--muted);
      }
      .graph .node {
        cursor: pointer;
      }
      .graph .node:hover rect {
        stroke: var(--muted);
        stroke-width: 2;
      }
      .graph .node:focus {
        outline: none;
      }
      .graph .node:focus-visible rect {
        stroke: var(--amber);
        stroke-width: 3;
      }
      .graph-hint {
        font-size: 11px;
        color: var(--muted);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        padding: 0;
        width: min(520px, calc(100vw - 28px));
        box-shadow: 0 24px 80px #0003;
      }
      dialog::backdrop {
        background: #15192255;
        backdrop-filter: blur(3px);
      }
      .dialog-head {
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
      }
      .dialog-body {
        padding: 22px 24px;
      }
      .dialog-foot {
        padding: 15px 24px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      label.field {
        display: block;
        font-size: 12px;
        margin-bottom: 16px;
      }
      label.field input,
      label.field textarea,
      label.field select {
        display: block;
        width: 100%;
        margin-top: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;

ection><section class="section"><div class="section-head"><h2>在其他知识中被提及</h2><span class="section-number">${mentions.length.toString().padStart(2, '0')}</span></div>${mentions.length ? `<div class="mention">${mentions.map(row).join('')}</div>` : '<p class="muted small">暂未在其他知识中被提及。</p>'}</section>`}</div></article>`;

tus !== 'confirmed' ? '<button class="btn primary" data-action="confirm">确认知识</button>' : '<span class="badge ok">✓ 内容已确认</span>'}</div>`;

      function openDialog(title, body, submitLabel, onSubmit) {

          '保存',

      const actions = {

      document.addEventListener('click', event => {
        const target = event.target.closest(
          '[data-nav],[data-concept],[data-item],[data-action],[data-tab],[data-filter]'
        );
        if (!target) return;
        if (target.dataset.nav) go(target.dataset.nav);
        else if (target.dataset.concept) go('detail', target.dataset.concept);
        else if (target.dataset.item) {
          selected = target.dataset.item;
          sourceMode = target.dataset.source === 'true';
          renderInspector();
        } else if (target.dataset.action) actions[target.dataset.action]?.();
        else if (target.dataset.tab) {
          tab = target.dataset.tab;
          render();
        } else if (target.dataset.filter) {
          filter = target.dataset.filter;
          render();
        }
      });
      $('#search').addEventListener('input', event => {
        query = event.target.value.trim();
        selected = null;
        render();
      });
      $('#back').addEventListener('click', () => {
        const previous = historyStack.pop();
        if (!previous) return;
        ({ page, current, tab, filter, query } = previous);
        selected = null;
        $('#search').value = query;
        render();
        $('#content').scrollTop = previous.scroll;
      });
      $('#create').addEventListener('click', () => editDialog());
      $('#theme').addEventListener('click', () => {
        document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      });
      $('#focus').addEventListener('click', () => {
        $('#app').classList.toggle('focus-mode');
        $('#focus').setAttribute('aria-pressed', $('#app').classList.contains('focus-mode'));
      });
      $('#menu').addEventListener('click', () => $('#sidebar').classList.toggle('mobile-open'));
      $('#reset').addEventListener('click', () =>
        openDialog(
          '重置演示数据',
          '<p>将清除你在此原型中新建、编辑、关联和确认的内容，恢复初始示例。</p><p class="muted small" style="margin-top:12px">不会影响 Knowra 的真实数据。</p>',
          '重置',
          () => {
            data = structuredClone(seed);
            save();
            historyStack = [];
            page = 'detail';
            current = 'cutmix';
            tab = 'knowledge';
            filter = 'all';
            query = '';
            selected = null;
            $('#search').value = '';
            render();
            notify('已恢复初始示例');
          }
        )
      );
      document.addEventListener('keydown', event => {
        if (event.target.closest('input,textarea,select') || $('#dialog').open) return;
        if (event.key === '/') {
          event.preventDefault();
          $('#search').focus();
        }
        if (event.key === 'Escape') {
          selected = null;
          $('#sidebar').classList.remove('mobile-open');
          renderInspector();
        }
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.node')) {
          event.preventDefault();
          go('detail', event.target.dataset.concept);
        }
      });
      render();
    </script>
  </body>
</html>
