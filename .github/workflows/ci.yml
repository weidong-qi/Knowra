name: PR428 定义草稿恢复专项
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  definition-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: NODE_ENV=production npm run build:web
      - run: npm run typecheck -w @study-accelerator/web
      - run: npm run check:boundaries -w @study-accelerator/web
      - name: 验证定义草稿恢复的真实页面流程
        run: npm run test:e2e -w @study-accelerator/web -- --config playwright.knowledge-concepts.config.ts concept-definitions.spec.ts
      - name: 保存合成失败现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: definition-recovery-${{ github.sha }}
          path: apps/web/test-results/mobile-evidence/concepts
          if-no-files-found: ignore
          retention-days: 7
