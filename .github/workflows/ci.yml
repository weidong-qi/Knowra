name: PDF 选区对照诊断（临时分支）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: PDF 选词 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts
      - name: 生成客户端
        run: npm run prisma:generate
      - name: 构建当前阅读器与只读诊断入口
        run: NODE_ENV=production npm run build:web
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 原 PDF 单词边界对照
        run: node scripts/pdf-selection-diagnosis.mjs
      - name: 保存数据和局部截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-selection-diagnosis-${{ matrix.os }}
          path: test-results/pdf-selection-diagnosis
          if-no-files-found: warn
          retention-days: 7
