name: PR429 知识库页面定向验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review429-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: NODE_ENV=production npm run build:web
      - run: npm run check:boundaries -w @study-accelerator/web
      - run: google-chrome --version
      - name: 运行真实 SQLite 知识库页面验收
        run: npm run test:e2e -w @study-accelerator/web -- --config playwright.knowledge-concepts.config.ts
      - name: 保存合成验收截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review429-knowledge-${{ github.sha }}
          path: apps/web/test-results/mobile-evidence/concepts
          if-no-files-found: ignore
          retention-days: 7
